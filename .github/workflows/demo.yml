name: Testujemy githuba
on:
 - push
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - run: echo 123 > test.html
   - uses: actions/upload-artifact@v7
     with:
      path: test.html

 test:
  needs: build
  runs-on: ubuntu-latest
  steps:
   - uses: actions/download-artifact@v8
   - run: test -f test.html

